name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env: { POSTGRES_USER: klyr, POSTGRES_PASSWORD: klyr, POSTGRES_DB: klyr }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U klyr" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://klyr:klyr@localhost:5432/klyr
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations apply cleanly
        run: pnpm db:migrate && pnpm db:seed
