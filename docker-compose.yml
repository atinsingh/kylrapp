# Local stand-ins for the AWS services in docs/ARCHITECTURE.md.
services:
  postgres:
    image: postgis/postgis:16-3.5
    environment: { POSTGRES_USER: klyr, POSTGRES_PASSWORD: klyr, POSTGRES_DB: klyr }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio: # S3
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: klyr, MINIO_ROOT_PASSWORD: klyr-local-secret }
    ports: ["9000:9000", "9001:9001"]
  mailpit: # SES
    image: axllent/mailpit:v1.24
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
